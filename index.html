const DAY_KEYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const DAY_LABELS = {monday:'Lunedì', tuesday:'Martedì', wednesday:'Mercoledì', thursday:'Giovedì', friday:'Venerdì'};
function minFromHHMM(s) { const [h,m]=s.split(':').map(Number); return h*60+m; }
function nowMinutes() { const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function todayKey() { return DAY_KEYS[new Date().getDay()]; }
function phoneClean(p) { return (p || '').trim(); }
function card(item, currentSlot) {
  const call = item.telHref ? `<a class="btn primary" href="tel:${item.telHref}">📞 Chiama</a>` : '';
  const wa = item.waHref ? `<a class="btn wa" href="https://wa.me/${item.waHref}">💬 WhatsApp</a>` : '';
  const maps = item.mapsHref ? `<a class="btn" href="${item.mapsHref}" target="_blank" rel="noopener">🗺️ Maps</a>` : '';
  return `<div class="card"><div class="doctor">${item.doctor}</div><div class="row">☎️ ${phoneClean(item.phone)}</div><div class="row">📍 ${item.address || ''}</div><div class="today-time">Oggi: ${currentSlot.display}</div><div class="buttons">${call}${wa}${maps}</div></div>`;
}
function renderAvailable() {
  const key=todayKey(); const now=nowMinutes(); const container=document.getElementById('availableNow');
  if (!DATA.schedule[key]) { container.className='empty'; container.innerHTML='Oggi non sono presenti orari ambulatoriali in tabella.'; return; }
  const active=[];
  DATA.rows.forEach(row => row.slots.filter(s => s.day===key).forEach(s => {
    if (s.start && s.end && now >= minFromHHMM(s.start) && now <= minFromHHMM(s.end)) active.push({...row, slot:s});
  }));
  if (!active.length) { container.className='empty'; container.innerHTML='In questo momento non risultano medici disponibili secondo la tabella oraria.'; return; }
  container.className=''; container.innerHTML=active.map(x=>card(x, x.slot)).join('');
}
function renderSchedule() {
  const out=[];
  ['monday','tuesday','wednesday','thursday','friday'].forEach(key => {
    const entries=DATA.schedule[key] || [];
    out.push(`<details><summary>${DAY_LABELS[key]}</summary><div class="day-list">` +
      entries.map(e => `<div class="slot"><strong>${e.display} — ${e.doctor}</strong><div class="row">☎️ ${e.phone || ''}</div><div class="row">📍 ${e.address || ''}</div><div class="small-buttons">${e.telHref?`<a class="btn primary" href="tel:${e.telHref}">📞 Chiama</a>`:''}${e.waHref?`<a class="btn wa" href="https://wa.me/${e.waHref}">💬 WhatsApp</a>`:''}${e.mapsHref?`<a class="btn" href="${e.mapsHref}" target="_blank" rel="noopener">🗺️ Maps</a>`:''}</div></div>`).join('') +
      `</div></details>`);
  });
  document.getElementById('fullSchedule').innerHTML=out.join('');
}
